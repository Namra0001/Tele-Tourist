<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=DM+Sans:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'DM Sans', sans-serif; background-color: var(--mist); }
        h1, h2, h3, h4, h5, h6 { font-family: 'Bricolage Grotesque', sans-serif; }
        
        .auth-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: linear-gradient(180deg, #E8F4F8 0%, #FDE8D3 100%);
        }
        
        .auth-card {
            background-color: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 1000px;
            display: flex;
            height: 700px;
        }
        
        .auth-left { 
            position: relative;
            background-image: url('assets/img/loginpageimage.png');
            background-size: cover;
            background-position: center;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 50%;
        }
        .auth-left > * { z-index: 1; position: relative; }
        
        .auth-right {
            width: 50%;
            padding: 60px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-y: auto;
        }
        
        .auth-form-wrapper {
            width: 100%;
            max-width: 360px;
            margin: auto;
        }
        
        .auth-nav-pills {
            background-color: var(--surface-field);
            border-radius: 50rem;
            padding: 4px;
            display: inline-flex;
            width: 100%;
            margin-bottom: 40px;
        }
        .auth-nav-pills .nav-link {
            border-radius: 50rem;
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 13px;
            padding: 10px 0;
        }
        .auth-nav-pills .nav-link.active {
            background-color: white;
            color: var(--ink);
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        
        .custom-input-wrapper {
            position: relative;
        }
        .custom-input-wrapper i {
            position: absolute;
            top: 50%;
            left: 16px;
            transform: translateY(-50%);
            color: var(--text-secondary);
        }
        .custom-input {
            padding: 12px 16px 12px 44px;
            border-radius: 8px;
            border: 1px solid var(--border-input);
            background-color: var(--surface-field);
            font-size: 14px;
        }
        .custom-input:focus {
            background-color: white;
            border-color: var(--lagoon);
            box-shadow: 0 0 0 4px rgba(32,85,107,0.1);
        }
        
        .logo-box {
            width: 32px; height: 32px;
            background-color: rgba(255,255,255,0.2);
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
        }
    </style>
    <link rel="stylesheet" href="css/style.css?v=8">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <!-- Left Side -->
            <div class="auth-left">
            </div>
            
            <!-- Right Side -->
            <div class="auth-right">
                <div class="auth-form-wrapper">
                    <div class="text-center">
                        <ul class="nav nav-pills auth-nav-pills" id="authTab" role="tablist">
                            <li class="nav-item flex-fill" role="presentation">
                                <button class="nav-link w-100" id="login-tab" data-bs-toggle="tab" data-bs-target="#login" type="button" role="tab">Log in</button>
                            </li>
                            <li class="nav-item flex-fill" role="presentation">
                                <button class="nav-link active w-100" id="register-tab" data-bs-toggle="tab" data-bs-target="#register" type="button" role="tab">Create account</button>
                            </li>
                        </ul>
                    </div>
                    
                    <div class="tab-content" id="authTabContent">
                        <!-- Login Tab -->
                        <div class="tab-pane fade" id="login" role="tabpanel">
                            <h2 class="fw-bold text-ink mb-2">Welcome back</h2>
                            <p class="text-secondary mb-4" style="font-size: 14px;">Log in to access your saved trips and stories.</p>
                            
                            <form id="loginForm" class="needs-validation" novalidate>
                                <div class="mb-4">
                                    <label for="loginEmail" class="form-label fw-bold text-ink" style="font-size: 12px;">Email</label>
                                    <div class="custom-input-wrapper">
                                        <i class="bi bi-envelope"></i>
                                        <input type="email" class="form-control custom-input shadow-none" id="loginEmail" placeholder="tourist@example.com" required>
                                    </div>
                                </div>
                                <div class="mb-4">
                                    <label for="loginPassword" class="form-label fw-bold text-ink" style="font-size: 12px;">Password</label>
                                    <div class="custom-input-wrapper">
                                        <i class="bi bi-lock"></i>
                                        <input type="password" class="form-control custom-input shadow-none" id="loginPassword" placeholder="••••••••" required>
                                    </div>
                                </div>
                                <button class="btn w-100 py-2 rounded-3 fw-bold mb-4" style="background-color: var(--lagoon); color: white;" type="submit">Log in</button>
                                
                                <p class="text-center text-secondary" style="font-size: 13px;">Don't have an account? <a href="#" class="text-primary text-decoration-none fw-bold" onclick="$('#register-tab').tab('show');" style="color: #0d6efd !important;">Create account</a></p>
                            </form>
                        </div>
                        
                        <!-- Register Tab -->
                        <div class="tab-pane fade show active" id="register" role="tabpanel">
                            <h2 class="fw-bold text-ink mb-2">Create your account</h2>
                            <p class="text-secondary mb-4" style="font-size: 14px;">Read, save and share trips with other travelers.</p>
                            
                            <form id="registerForm" class="needs-validation" novalidate>
                                <div class="mb-4">
                                    <label for="regName" class="form-label fw-bold text-ink" placeholder="Full name" style="font-size: 12px;">Full name</label>
                                    <div class="custom-input-wrapper">
                                        <i class="bi bi-person"></i>
                                        <input type="text" class="form-control custom-input shadow-none" id="regName" placeholder="Full name" required>
                                    </div>
                                </div>
                                <div class="mb-4">
                                    <label for="regEmail" class="form-label fw-bold text-ink" style="font-size: 12px;">Email</label>
                                    <div class="custom-input-wrapper">
                                        <i class="bi bi-envelope"></i>
                                        <input type="email" class="form-control custom-input shadow-none" id="regEmail" placeholder="tourist@example.com" required>
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label for="regPassword" class="form-label fw-bold text-ink" style="font-size: 12px;">Password</label>
                                    <div class="custom-input-wrapper mb-2">
                                        <i class="bi bi-lock"></i>
                                        <input type="password" class="form-control custom-input shadow-none" id="regPassword" placeholder="••••••••" required minlength="8">
                                    </div>
                                    <div class="text-secondary" style="font-size: 11px;">Use at least 8 characters.</div>
                                </div>
                                <button class="btn w-100 py-2 rounded-3 fw-bold mb-4 mt-3" style="background-color: var(--lagoon); color: white;" type="submit">Create account</button>
                                
                                <p class="text-center text-secondary" style="font-size: 13px;">Already have an account? <a href="#" class="text-primary text-decoration-none fw-bold" onclick="$('#login-tab').tab('show');" style="color: #0d6efd !important;">Log in</a></p>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/mock-data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
