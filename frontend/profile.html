<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Tele Tourist</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=DM+Sans:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'DM Sans', sans-serif; background-color: var(--surface-white); }
        h1, h2, h3, h4, h5, h6 { font-family: 'Bricolage Grotesque', sans-serif; }
        
        .cover-banner {
            height: 250px;
            width: 100%;
            background-color: #4A6782;
            position: relative;
            overflow: hidden;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" preserveAspectRatio="none"><path d="M0,250 L300,50 L600,250 Z" fill="%233A5776"/><path d="M400,250 L700,80 L1000,250 Z" fill="%232D4660"/><path d="M800,250 L1100,20 L1400,250 Z" fill="%233A5776"/></svg>');
            background-size: cover;
            background-position: center;
        }
        
        .nav-tabs .nav-link {
            border: none;
            border-bottom: 2px solid transparent;
            color: var(--text-muted);
            font-weight: 500;
        }
        .nav-tabs .nav-link.active {
            color: var(--ink);
            border-bottom: 2px solid var(--lagoon);
            font-weight: 600;
            background: transparent;
        }
    
        .preview-card { border: 1px solid var(--border-card) !important; border-radius: 16px; overflow: hidden; box-shadow: none; background: white; }
        .preview-img { width: 100%; height: 180px; position: relative; }
    </style>
    <link rel="stylesheet" href="css/style.css?v=5">
</head>
<body>
    <div id="navbar-placeholder"></div>

    <div class="cover-banner" id="profileCover"></div>
    
    <div class="container position-relative mb-5" style="margin-top: -70px;">
        <div class="d-flex flex-column flex-md-row gap-4 mb-4">
            <div class="flex-shrink-0">
                <div class="rounded-circle d-flex align-items-center justify-content-center text-white" id="profileAvatar" style="width: 140px; height: 140px; border: 4px solid white; background-color: var(--lagoon); font-size: 32px; font-weight: bold; position: relative; z-index: 2;">
                    <div class="spinner-border spinner-border-sm text-light" role="status"></div>
                </div>
            </div>
            <div class="flex-grow-1">
                <h2 class="fw-bold" id="profileName" style="font-size: 32px; margin-top: 15px; margin-bottom: 40px; color: #ffffff !important;"></h2>
                <p class="text-muted small mb-3"><i class="bi bi-geo-alt"></i> <span id="profileLocation"><span class="placeholder-glow"><span class="placeholder col-4 bg-light opacity-50"></span></span></span></p>
                <p class="text-secondary" style="max-width: 650px; font-size: 15px;" id="profileBio"><span class="placeholder-glow"><span class="placeholder col-8 bg-light opacity-50"></span></span></p>
                
                <div class="d-flex gap-5 mt-4">
                    <div>
                        <h3 class="fw-bold text-ink mb-0" id="statStories">-</h3>
                        <div class="text-muted small">Stories</div>
                    </div>
                    <div>
                        <h3 class="fw-bold text-ink mb-0" id="statLikes">-</h3>
                        <div class="text-muted small">Likes received</div>
                    </div>
                    <div>
                        <h3 class="fw-bold text-ink mb-0" id="statSaved">-</h3>
                        <div class="text-muted small">Times saved</div>
                    </div>
                </div>
            </div>
            
            <div class="d-flex gap-2 flex-shrink-0" style="margin-top: 80px;">
                <button class="btn text-white px-3 py-2 text-nowrap" id="btnChatUser" style="display: none; background-color: var(--lagoon); border-radius: 8px; font-weight: 500; height: fit-content; font-size: 14px;"><i class="bi bi-chat-dots me-2"></i> Chat</button>
                <button class="btn bg-white px-3 py-2 text-nowrap" id="btnShareProfile" style="border: 1px solid var(--border-input); border-radius: 8px; font-weight: 500; height: fit-content; font-size: 14px;"><i class="bi bi-upload me-2"></i> Copy profile</button>
                <button class="btn px-3 py-2 text-nowrap" id="btnEditProfile" style="display: none; background-color: var(--ink); color: white; border-radius: 8px; font-weight: 500; height: fit-content; font-size: 14px;"><i class="bi bi-pencil me-2"></i> Edit profile</button>
            </div>
        </div>

        <ul class="nav nav-tabs mt-5 mb-4 border-bottom-0 gap-4" id="profileTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active px-0 pb-2" id="stories-tab" data-bs-toggle="tab" data-bs-target="#stories" type="button" role="tab">Stories</button>
            </li>
            <li class="nav-item" role="presentation" id="saved-tab-li">
                <button class="nav-link px-0 pb-2" id="saved-tab" data-bs-toggle="tab" data-bs-target="#saved" type="button" role="tab">Saved</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link px-0 pb-2" id="about-tab" data-bs-toggle="tab" data-bs-target="#about" type="button" role="tab">About</button>
            </li>
        </ul>

        <div class="tab-content" id="profileTabsContent">
            <div class="tab-pane fade show active" id="stories" role="tabpanel">
                <div class="row g-4" id="storiesGrid">
                    <!-- Dynamic user stories loaded via profile.js -->
                    <div class="col-12 py-5 text-center text-muted">Loading stories...</div>
                </div>
            </div>
            <div class="tab-pane fade" id="saved" role="tabpanel">
                <div class="row g-4" id="savedGrid">
                    <!-- Dynamic saved stories loaded via profile.js -->
                    <div class="col-12 py-5 text-center text-muted">Loading saved stories...</div>
                </div>
            </div>
            <div class="tab-pane fade" id="about" role="tabpanel">
                <div class="card card-body border-0 shadow-sm p-4" style="border-radius: 16px; background-color: white;" id="aboutContent">
                    Loading about info...
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Profile Modal -->
    <div class="modal fade" id="editProfileModal" tabindex="-1" aria-labelledby="editProfileModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content" style="border-radius: 16px; border: 1px solid var(--border-card);">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title fw-bold text-ink" id="editProfileModalLabel" style="font-family: 'Bricolage Grotesque', sans-serif;">Edit Profile</h5>
                    <button type="button" class="btn-close shadow-none" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="editProfileForm">
                    <div class="modal-body pt-3">
                        <div class="mb-3">
                            <label class="form-label small fw-bold text-ink">Full Name</label>
                            <input type="text" class="form-control" id="editProfileName" required style="border-radius: 8px; border-color: var(--border-input);">
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold text-ink">Location</label>
                            <input type="text" class="form-control" id="editProfileLocation" placeholder="e.g. Manali, Himachal Pradesh" style="border-radius: 8px; border-color: var(--border-input);">
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold text-ink">Bio</label>
                            <textarea class="form-control" id="editProfileBio" rows="3" placeholder="Tell travelers about yourself..." style="border-radius: 8px; border-color: var(--border-input);"></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold text-ink">Avatar Image (optional file)</label>
                            <input type="file" class="form-control" id="editProfileAvatarFile" accept="image/*" style="border-radius: 8px; border-color: var(--border-input);">
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold text-ink">Banner Image (optional file)</label>
                            <input type="file" class="form-control" id="editProfileBannerFile" accept="image/*" style="border-radius: 8px; border-color: var(--border-input);">
                        </div>
                        <div id="editProfileError" class="text-danger small mb-2 d-none"></div>
                    </div>
                    <div class="modal-footer border-0 pt-0">
                        <button type="button" class="btn btn-light" data-bs-dismiss="modal" style="border-radius: 8px; font-weight: 500;">Cancel</button>
                        <button type="submit" class="btn text-white" id="btnSaveProfile" style="background-color: var(--lagoon); border-radius: 8px; font-weight: 600;">Save Changes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Chat Modal -->
    <div class="modal fade" id="chatModal" tabindex="-1" aria-labelledby="chatModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable" style="max-width: 480px;">
            <div class="modal-content border-0 shadow" style="border-radius: 20px; overflow: hidden;">
                <div class="modal-header border-bottom py-3 px-4" style="background-color: var(--sand-light);">
                    <div class="d-flex align-items-center gap-3">
                        <div id="chatRecipientAvatar" class="rounded-circle d-flex align-items-center justify-content-center text-white fw-bold overflow-hidden" style="width: 42px; height: 42px; background-color: var(--lagoon); font-size: 14px;">
                            AK
                        </div>
                        <div>
                            <h6 class="fw-bold text-ink mb-0" id="chatRecipientName" style="font-size: 15px;">Aarav Kapadia</h6>
                            <span class="text-success d-flex align-items-center gap-1" style="font-size: 11px; font-weight: 500;">
                                <span style="width: 7px; height: 7px; background-color: #28a745; border-radius: 50%; display: inline-block;"></span> Active now
                            </span>
                        </div>
                    </div>
                    <button type="button" class="btn-close shadow-none" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-3 d-flex flex-column gap-3" id="chatMessagesContainer" style="height: 380px; overflow-y: auto; background-color: #f8fafc;">
                    <!-- Messages render dynamically here -->
                </div>
                <div class="modal-footer border-top p-2 bg-white">
                    <form id="chatForm" class="d-flex gap-2 w-100 align-items-center m-0">
                        <input type="text" id="chatInput" class="form-control border shadow-none" placeholder="Write a message to start conversation..." style="border-radius: 24px; font-size: 14px; padding: 10px 16px;" autocomplete="off" required>
                        <button type="submit" class="btn text-white rounded-circle d-flex align-items-center justify-content-center flex-shrink-0" style="width: 42px; height: 42px; background-color: var(--lagoon); border: none;">
                            <i class="bi bi-send-fill" style="font-size: 14px; margin-left: 2px;"></i>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div id="footer-placeholder"></div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/mock-data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js?v=20261012_v4"></script>
  <script src="js/profile.js?v=20261012_loc1"></script>
</body>
</html>
