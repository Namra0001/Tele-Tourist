<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auth - Tele Tourist</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=DM+Sans:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'DM Sans', sans-serif; }
        h1, h2, h3, h4, h5, h6 { font-family: 'Bricolage Grotesque', sans-serif; }
        .auth-bg {
            background-image: url('https://images.unsplash.com/photo-1488646953014-c8c32548pnf5?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            height: 100vh;
            position: relative;
        }
        .auth-bg::after {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4);
        }
        .quote-container {
            position: absolute;
            bottom: 10%;
            left: 10%;
            color: white;
            z-index: 2;
            max-width: 80%;
        }
        .auth-form-container {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 10%;
        }
    </style>
    <link rel="stylesheet" href="css/style.css?v=3">
</head>
<body>
  <div id="navbar-placeholder"></div>
    <div class="container-fluid p-0">
        <div class="row g-0">
            <div class="col-lg-6 d-none d-lg-block auth-bg">
                <div class="quote-container">
                    <h2 class="mb-3">"The world is a book, and those who do not travel read only one page."</h2>
                    <p class="lead mb-0">- Saint Augustine</p>
                </div>
            </div>
            <div class="col-lg-6 auth-form-container">
                <div class="w-100" style="max-width: 400px; margin: 0 auto;">
                    <h1 class="mb-4 text-center">Tele Tourist</h1>
                    
                    <ul class="nav nav-pills nav-justified mb-4" id="authTab" role="tablist">
                        <li class="nav-item" role="presentation">
                            <button class="nav-link active" id="login-tab" data-bs-toggle="tab" data-bs-target="#login" type="button" role="tab">Log In</button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link" id="register-tab" data-bs-toggle="tab" data-bs-target="#register" type="button" role="tab">Create Account</button>
                        </li>
                    </ul>

                    <div class="tab-content" id="authTabContent">
                        <div class="tab-pane fade show active" id="login" role="tabpanel">
                            <form id="loginForm" class="needs-validation" novalidate>
                                <div class="mb-3">
                                    <label for="loginEmail" class="form-label">Email address</label>
                                    <input type="email" class="form-control" id="loginEmail" required>
                                    <div class="invalid-feedback">Please enter a valid email.</div>
                                </div>
                                <div class="mb-3">
                                    <label for="loginPassword" class="form-label">Password</label>
                                    <input type="password" class="form-control" id="loginPassword" required>
                                    <div class="invalid-feedback">Password is required.</div>
                                </div>
                                <button class="btn btn-primary w-100" type="submit">Log In</button>
                            </form>
                        </div>
                        
                        <div class="tab-pane fade" id="register" role="tabpanel">
                            <form id="registerForm" class="needs-validation" novalidate>
                                <div class="mb-3">
                                    <label for="regName" class="form-label">Full Name</label>
                                    <input type="text" class="form-control" id="regName" required>
                                    <div class="invalid-feedback">Please enter your full name.</div>
                                </div>
                                <div class="mb-3">
                                    <label for="regEmail" class="form-label">Email address</label>
                                    <input type="email" class="form-control" id="regEmail" required>
                                    <div class="invalid-feedback">Please enter a valid email.</div>
                                </div>
                                <div class="mb-3">
                                    <label for="regPassword" class="form-label">Password</label>
                                    <input type="password" class="form-control" id="regPassword" required minlength="8">
                                    <div class="form-text">Must be at least 8 characters long.</div>
                                    <div class="invalid-feedback">Password must be at least 8 characters.</div>
                                </div>
                                <button class="btn btn-primary w-100" type="submit">Create Account</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

      <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/mock-data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js?v=5"></script>
  <script src="js/auth.js"></script>
</body>
</html>
