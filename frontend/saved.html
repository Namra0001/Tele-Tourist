<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saved Stories - Tele Tourist</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=DM+Sans:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'DM Sans', sans-serif; background-color: #f8f9fa; }
        h1, h2, h3, h4, h5, h6 { font-family: 'Bricolage Grotesque', sans-serif; }
        .saved-list-item {
            transition: transform 0.2s;
        }
        .saved-list-item:hover {
            transform: translateY(-2px);
        }
        .story-thumb {
            width: 160px;
            height: 120px;
            object-fit: cover;
            border-radius: 0.5rem;
        }
        .chip {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 50rem;
            background-color: #e9ecef;
            font-size: 0.875rem;
            margin-right: 0.5rem;
            margin-bottom: 0.5rem;
            cursor: pointer;
        }
        .chip:hover, .chip.active {
            background-color: #0d6efd;
            color: white;
        }
        .excerpt {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
    <link rel="stylesheet" href="css/style.css?v=3">
</head>
<body>
    <div id="navbar-placeholder"></div>

    <div class="container my-5">
        <div class="row">
            <div class="col-lg-8 mb-4">
                <h2 class="mb-4">Saved Stories</h2>
                
                <div class="mb-4" id="categoryChips">
                    <span class="chip active">All</span>
                    <span class="chip">Asia</span>
                    <span class="chip">Europe</span>
                    <span class="chip">Nature</span>
                    <span class="chip">City</span>
                </div>

                <div id="savedStoriesList" class="d-flex flex-column gap-3">
                </div>
            </div>

            <div class="col-lg-4">
                <div class="card border-0 shadow-sm">
                    <div class="card-body">
                        <h4 class="card-title mb-4">Where you want to go</h4>
                        <div id="whereToGoStats">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="footer-placeholder"></div>

      <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/mock-data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js?v=9"></script>
  <script src="js/saved.js"></script>
</body>
</html>
