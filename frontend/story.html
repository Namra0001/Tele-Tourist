<!-- story.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Story - Tele Tourist</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=DM+Sans:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { font-family: 'DM Sans', sans-serif; background-color: #f8f9fa; }
        h1, h2, h3, h4, h5, h6, .brand-font { font-family: 'Bricolage Grotesque', sans-serif; }
        .mosaic-grid { display: grid; grid-template-columns: 2fr 1fr 1fr; grid-template-rows: repeat(2, 200px); gap: 10px; border-radius: 12px; overflow: hidden; position: relative; }
        .mosaic-item { width: 100%; height: 100%; object-fit: cover; }
        .mosaic-item-main { grid-column: 1; grid-row: 1 / span 2; }
        .btn-see-all { position: absolute; bottom: 15px; right: 15px; background: rgba(255,255,255,0.9); color: #000; font-weight: 500; }
        .pull-quote { font-size: 1.25rem; font-style: italic; border-left: 4px solid #f2c94c; padding-left: 1rem; margin: 2rem 0; color: #555; }
        .sticky-card { position: sticky; top: 100px; }
        .map-block { background: #e9ecef; height: 150px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #6c757d; }
        .saffron-bg { background-color: #f3c93e; color: #000; }
        .saffron-btn { background-color: #f3c93e; color: #000; border: none; font-weight: 600; }
        .saffron-btn:hover { background-color: #e0b830; }
        .chip { display: inline-block; padding: 4px 12px; border-radius: 20px; background: #e9ecef; font-size: 0.85rem; font-weight: 500; }
        #author-profile-link:hover #author-name { color: var(--lagoon) !important; text-decoration: underline; }
        #author-profile-link:hover #author-avatar { transform: scale(1.08); }
    </style>
    <link rel="stylesheet" href="css/style.css?v=3">
</head>
<body>
    <div id="navbar-placeholder"></div>

    <div class="container py-4">
        <nav aria-label="breadcrumb" class="mb-3">
            <ol class="breadcrumb" id="story-breadcrumb">
                <li class="breadcrumb-item"><a href="index.html">Home</a></li>
                <li class="breadcrumb-item"><a href="explore.html">Explore</a></li>
                <li class="breadcrumb-item active" aria-current="page">Story</li>
            </ol>
        </nav>

        <div class="mb-3">
            <span class="chip" id="story-category">Category</span>
        </div>

        <h1 class="display-5 fw-bold mb-3" id="story-title">Loading Story...</h1>
        
        <div class="d-flex align-items-center mb-4">
            <a href="#" id="author-profile-link" class="d-flex align-items-center text-decoration-none text-reset" title="View traveler profile" style="cursor: pointer;">
                <img src="https://via.placeholder.com/40" class="rounded-circle me-2" alt="Author" id="author-avatar" style="width: 40px; height: 40px; object-fit: cover; transition: transform 0.2s;">
                <div>
                    <div class="fw-bold text-ink" id="author-name" style="transition: color 0.2s;">Author Name</div>
                    <div class="text-muted small" id="story-date">Date</div>
                </div>
            </a>
            <div class="ms-4 d-flex text-warning fs-5" id="story-rating">
                <!-- Stars will be injected here -->
            </div>
        </div>

        <div class="mosaic-grid mb-5" id="photo-mosaic">
            <!-- Populated via JS -->
            <img src="https://via.placeholder.com/800x400" class="mosaic-item mosaic-item-main" alt="Main Photo">
            <img src="https://via.placeholder.com/400x200" class="mosaic-item" alt="Photo 2">
            <img src="https://via.placeholder.com/400x200" class="mosaic-item" alt="Photo 3">
            <img src="https://via.placeholder.com/400x200" class="mosaic-item" alt="Photo 4">
            <img src="https://via.placeholder.com/400x200" class="mosaic-item" alt="Photo 5">
            <button class="btn btn-sm btn-see-all" data-bs-toggle="modal" data-bs-target="#galleryModal">
                <i class="bi bi-grid-3x3-gap-fill me-1"></i> See all photos
            </button>
        </div>

        <div class="row">
            <div class="col-lg-8">
                <article id="story-content" class="fs-5 text-dark" style="line-height: 1.8;">
                    <p>Loading content...</p>
                </article>

                <hr class="my-5">

                <section id="comments-section">
                    <h3 class="mb-4">Comments (<span id="comment-count">0</span>)</h3>
                    
                    <div class="card border-0 shadow-sm mb-4">
                        <div class="card-body">
                            <form id="comment-form">
                                <div class="mb-3">
                                    <textarea class="form-control bg-light" id="comment-text" rows="3" placeholder="Leave a comment..."></textarea>
                                </div>
                                <button type="submit" class="btn saffron-btn px-4">Post Comment</button>
                            </form>
                        </div>
                    </div>

                    <div id="comments-list">
                        <!-- Comments inserted here -->
                    </div>
                </section>
            </div>
            
            <div class="col-lg-4">
                <div class="card border-0 shadow-sm" style="border-radius: 12px; background: white;">
                    <div class="card-body">
                        <div class="d-flex align-items-center mb-1">
                            <img src="assets/img/location.png" style="width: 16px; margin-right: 8px;" alt="Location">
                            <h5 class="fw-bold mb-0" id="story-location-name">Location Name</h5>
                        </div>
                        <p class="text-muted small mb-3 ms-4">
                            <span id="story-location">City, Country</span>
                        </p>

                        <div class="d-flex justify-content-between mb-4 text-center">
                            <div>
                                <div class="fw-bold fs-5" id="stat-photos">0</div>
                                <div class="text-muted small">Photos</div>
                            </div>
                            <div>
                                <div class="fw-bold fs-5" id="stat-category">--</div>
                                <div class="text-muted small">Category</div>
                            </div>
                            <div>
                                <div class="fw-bold fs-5" id="stat-likes">0</div>
                                <div class="text-muted small">Likes</div>
                            </div>
                        </div>

                        <div class="d-grid gap-2">
                            <button class="btn btn-outline-dark" id="btn-like">
                                <img src="assets/img/heart.png" class="me-2 action-icon" style="width: 16px;" alt="Like"> Like
                            </button>
                            <button class="btn btn-outline-dark" id="btn-save">
                                <img src="assets/img/save-instagram.png" class="me-2 action-icon" style="width: 16px;" alt="Save"> Save
                            </button>
                            <button class="btn btn-outline-dark" id="btn-share">
                                <img src="assets/img/share.png" class="me-2 action-icon" style="width: 16px;" alt="Share"> Share
                            </button>
                        </div>
                    </div>
                </div>

                <!-- All 4 Ratings Card -->
                <div class="card border-0 shadow-sm mt-4" id="ratings-card" style="border-radius: 12px; background: white;">
                    <div class="card-body p-4">
                        <h5 class="fw-bold mb-3 brand-font text-ink" style="font-family: 'Bricolage Grotesque', sans-serif;">Ratings</h5>
                        
                        <div class="mb-3 d-flex justify-content-between align-items-center">
                            <span class="small fw-medium text-secondary d-flex align-items-center"><img src="assets/img/user.png" style="width: 18px; height: 18px; margin-right: 8px;" alt="People"> People</span>
                            <div class="star-rating text-warning" id="rating-stars-people">
                                <i class="bi bi-star-fill"></i><i class="bi bi-star-fill"></i><i class="bi bi-star-fill"></i><i class="bi bi-star-fill"></i><i class="bi bi-star-fill"></i>
                            </div>
                        </div>
                        
                        <div class="mb-3 d-flex justify-content-between align-items-center">
                            <span class="small fw-medium text-secondary d-flex align-items-center"><img src="assets/img/food.png" style="width: 18px; height: 18px; margin-right: 8px;" alt="Food"> Food</span>
                            <div class="star-rating text-warning" id="rating-stars-food">
                                <i class="bi bi-star-fill"></i><i class="bi bi-star-fill"></i><i class="bi bi-star-fill"></i><i class="bi bi-star-fill"></i><i class="bi bi-star-fill"></i>
                            </div>
                        </div>

                        <div class="mb-3 d-flex justify-content-between align-items-center">
                            <span class="small fw-medium text-secondary d-flex align-items-center"><img src="assets/img/cleaness.png" style="width: 18px; height: 18px; margin-right: 8px;" alt="Cleanliness"> Cleanliness</span>
                            <div class="star-rating text-warning" id="rating-stars-cleanliness">
                                <i class="bi bi-star-fill"></i><i class="bi bi-star-fill"></i><i class="bi bi-star-fill"></i><i class="bi bi-star-fill"></i><i class="bi bi-star-fill"></i>
                            </div>
                        </div>

                        <div class="mb-3 d-flex justify-content-between align-items-center">
                            <span class="small fw-medium text-secondary d-flex align-items-center"><img src="assets/img/safety.png" style="width: 18px; height: 18px; margin-right: 8px;" alt="Safety"> Safety</span>
                            <div class="star-rating text-warning" id="rating-stars-safety">
                                <i class="bi bi-star-fill"></i><i class="bi bi-star-fill"></i><i class="bi bi-star-fill"></i><i class="bi bi-star-fill"></i><i class="bi bi-star-fill"></i>
                            </div>
                        </div>

                        <hr class="my-3">

                        <div class="d-flex justify-content-between align-items-center fw-bold text-ink">
                            <span class="small"><i class="bi bi-star-fill text-warning me-1"></i> Overall</span>
                            <span id="rating-overall-score" class="text-warning fw-bold">5.0 / 5.0</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Gallery Modal -->
    <div class="modal fade" id="galleryModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-xl modal-dialog-centered">
            <div class="modal-content bg-transparent border-0">
                <div class="modal-header border-0">
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-0 text-center">
                    <div id="galleryCarousel" class="carousel slide" data-bs-ride="carousel">
                        <div class="carousel-inner" id="gallery-carousel-inner">
                            <!-- Items -->
                        </div>
                        <button class="carousel-control-prev" type="button" data-bs-target="#galleryCarousel" data-bs-slide="prev">
                            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                            <span class="visually-hidden">Previous</span>
                        </button>
                        <button class="carousel-control-next" type="button" data-bs-target="#galleryCarousel" data-bs-slide="next">
                            <span class="carousel-control-next-icon" aria-hidden="true"></span>
                            <span class="visually-hidden">Next</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="footer-placeholder"></div>

    <!-- Assuming apiCall is here -->
      <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/mock-data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js?v=20261012_v4"></script>
  <script src="js/story.js?v=20261012_v4"></script>
</body>
</html>
